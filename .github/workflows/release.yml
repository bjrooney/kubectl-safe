name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Checkout main branch
      run: |
        git checkout main
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
    - name: Extract version from tag
      run: |
        TAG=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$TAG" >> $GITHUB_ENV
        echo "Building version: $TAG"
        echo "$TAG" > VERSION
    - name: Run tests
      run: make test
    - name: Build for multiple platforms
      run: |
        VERSION=$(cat VERSION)
        LDFLAGS="-X github.com/bjrooney/kubectl-safe/pkg/safe.Version=$VERSION"
        mkdir -p dist
        # Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/kubectl-safe ./cmd/kubectl-safe
        tar -czf dist/kubectl-safe-linux-amd64.tar.gz -C dist kubectl-safe
        rm dist/kubectl-safe
        # Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/kubectl-safe ./cmd/kubectl-safe
        tar -czf dist/kubectl-safe-linux-arm64.tar.gz -C dist kubectl-safe
        rm dist/kubectl-safe
        # Darwin AMD64
        GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/kubectl-safe ./cmd/kubectl-safe
        tar -czf dist/kubectl-safe-darwin-amd64.tar.gz -C dist kubectl-safe
        rm dist/kubectl-safe
        # Darwin ARM64
        GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/kubectl-safe ./cmd/kubectl-safe
        tar -czf dist/kubectl-safe-darwin-arm64.tar.gz -C dist kubectl-safe
        rm dist/kubectl-safe
        # Windows AMD64
        GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/kubectl-safe.exe ./cmd/kubectl-safe
        zip -j dist/kubectl-safe-windows-amd64.zip dist/kubectl-safe.exe
        rm dist/kubectl-safe.exe
        # Windows ARM64
        GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/kubectl-safe.exe ./cmd/kubectl-safe
        zip -j dist/kubectl-safe-windows-arm64.zip dist/kubectl-safe.exe
        rm dist/kubectl-safe.exe
    - name: Update safe.yaml with version
      run: |
        VERSION=$(cat VERSION)
        sed -i "s/version: v.*/version: v$VERSION/" safe.yaml
        sed -i "s|download/v.*/kubectl-safe|download/v$VERSION/kubectl-safe|g" safe.yaml
    - name: Update checksums in safe.yaml
      run: |
        ./checksum.sh safe.yaml
    - name: Copy safe.yaml to plugins/safe.yaml
      run: |
        cp safe.yaml plugins/safe.yaml
    - name: Create PR for safe.yaml updates
      run: |
        VERSION=$(cat VERSION)
        BRANCH_NAME="release/update-safe-yaml-v$VERSION"
        
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Create and switch to new branch
        git checkout -b "$BRANCH_NAME"
        
        # Add and commit changes
        git add plugins/safe.yaml safe.yaml
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update safe.yaml and plugins/safe.yaml to version v$VERSION
          
          - Updated version to v$VERSION
          - Updated download URLs for v$VERSION
          - Updated SHA256 checksums for all platforms"
          
          # Push the branch
          git push origin "$BRANCH_NAME"
          
          # Create PR using GitHub CLI
          PR_URL=$(gh pr create \
            --title "Update safe.yaml to version v$VERSION" \
            --body "Automated update of safe.yaml and plugins/safe.yaml for release v$VERSION
          
          This PR updates:
          - Version number to v$VERSION
          - Download URLs to point to v$VERSION release
          - SHA256 checksums for all platform binaries
          
          Auto-generated by release workflow." \
            --base main \
            --head "$BRANCH_NAME")
          
          echo "Created PR: $PR_URL"
          
          # Try to auto-merge the PR (this may fail if branch protection is enabled)
          if gh pr merge "$BRANCH_NAME" --auto --squash; then
            echo "PR set to auto-merge"
          else
            echo "Could not enable auto-merge. PR created and waiting for manual review: $PR_URL"
          fi
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/kubectl-safe-linux-amd64.tar.gz
          dist/kubectl-safe-linux-arm64.tar.gz
          dist/kubectl-safe-darwin-amd64.tar.gz
          dist/kubectl-safe-darwin-arm64.tar.gz
          dist/kubectl-safe-windows-amd64.zip
          dist/kubectl-safe-windows-arm64.zip
          safe.yaml
        generate_release_notes: true
        body: |
          ## kubectl-safe v${{ env.VERSION }}
          ### Changes
          - Version bumped to v${{ env.VERSION }}
          ### Installation
          #### Krew (recommended)
          ```bash
          kubectl krew install safe
          ```
          #### Manual Installation
          Download the appropriate binary for your platform from the assets below and place it in your PATH.
          ### Usage
          ```bash
          kubectl safe --version
          kubectl safe delete pod mypod --context=prod --namespace=default
          ```
          ### Checksums
          See the attached safe.yaml file for SHA256 checksums of all binaries.
          checksums.txt
    - name: Trigger Krew Index Update
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.KREW_INDEX_TOKEN }}
        repository: bjrooney/kubectl-safe
        event-type: krew-publish
        client-payload: '{"version": "${{ github.ref_name }}"}'
 
